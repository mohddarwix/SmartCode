name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Python tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testpass
          MARIADB_DATABASE: ai_tutor_system
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      - name: Seed database
        run: |
          mysql -h 127.0.0.1 -P 3307 -u root -ptestpass < database/schema.sql
          mysql -h 127.0.0.1 -P 3307 -u root -ptestpass ai_tutor_system < database/seed_problems.sql
          mysql -h 127.0.0.1 -P 3307 -u root -ptestpass ai_tutor_system < database/seed_problems_extra.sql
          mysql -h 127.0.0.1 -P 3307 -u root -ptestpass ai_tutor_system < database/seed_cheatsheets.sql
          mysql -h 127.0.0.1 -P 3307 -u root -ptestpass ai_tutor_system < database/seed_users.sql

      - name: Run pytest
        env:
          DATABASE_URL: mysql+pymysql://root:testpass@127.0.0.1:3307/ai_tutor_system
          JWT_SECRET: ci-test-secret-not-for-production
          JWT_ALGORITHM: HS256
          JWT_EXPIRES_MINUTES: "1440"
          CORS_ORIGINS: http://localhost:5173
          GOOGLE_API_KEY: ""
          LLM_MODEL: gemini-2.5-flash
          LLM_MAX_TOKENS: "4096"
        run: pytest backend/tests/ -v

  # ── Frontend build ────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Black
        run: pip install black

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Black check
        run: black --check backend/

      - name: ESLint
        run: npm run lint
