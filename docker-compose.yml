services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-smartcode_dev}
      MARIADB_DATABASE: ai_tutor_system
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Init scripts run once on a fresh volume, in alphabetical order.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/seed_problems.sql:/docker-entrypoint-initdb.d/03_seed_problems.sql:ro
      - ./database/seed_problems_extra.sql:/docker-entrypoint-initdb.d/04_seed_problems_extra.sql:ro
      - ./database/seed_cheatsheets.sql:/docker-entrypoint-initdb.d/05_seed_cheatsheets.sql:ro
      - ./database/seed_users.sql:/docker-entrypoint-initdb.d/06_seed_users.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Backend (FastAPI / uvicorn) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Override with a real secret in any non-local environment.
      DATABASE_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-smartcode_dev}@db:3306/ai_tutor_system
      JWT_SECRET: ${JWT_SECRET:-change-me-not-for-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_MINUTES: 1440
      CORS_ORIGINS: http://localhost:5173
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Vite dev server) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      # Points Vite's /api proxy at the backend service inside the Docker network.
      VITE_BACKEND_URL: http://backend:8001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
